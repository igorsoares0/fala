services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fala
      POSTGRES_PASSWORD: fala
      POSTGRES_DB: fala_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fala -d fala_dev"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
